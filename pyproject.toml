[project]
name = "quote-workflow"
version = "0.1.0"
description = "DSister Quote Workflow: RFQ -> QuoteCase -> deterministic pricing -> reviewer portal -> quotation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
llm = ["openai>=1.50"]
observability = ["langfuse>=4.15,<5", "python-dotenv>=1.0", "truststore>=0.9"]
ui = ["streamlit>=1.50", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quote_workflow = ["**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["quote_workflow", "ui", "views"]
